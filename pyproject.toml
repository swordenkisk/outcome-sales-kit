[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-sales-kit"
version = "0.1.0"
description = "A local sales planning toolkit for outcome-focused GoHighLevel demos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
outcome-sales = "outcome_sales_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
